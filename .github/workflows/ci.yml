# =============================================================================
# CI for Next.js projects - ESLint, Prettier, tsc, Vitest, build,
# Playwright E2E and npm audit
#
# Install as: .github/workflows/ci.yml
#
# Green from the first commit of a scaffolded project, and honest about it.
# Lint, build and audit run against what create-next-app produces. The Vitest and
# Playwright jobs check whether their configuration exists and skip with a note in
# the run summary when it does not, so the pipeline is not red for weeks over
# tooling nobody has added yet. Add the config and the job turns real on its own.
#
# Required from the start (create-next-app gives you the first three):
#   - eslint + eslint-config-next   (recent Next versions no longer run ESLint
#                                    as part of the build, so run it explicitly)
#   - typescript
#   - prettier                      (kickoff installs it and formats once, so
#                                    `prettier --check` passes immediately)
#
# Turns jobs on when added:
#   - vitest + @vitest/coverage-v8, with vitest.config.ts. Raise COVERAGE_MIN
#     below as the suite grows.
#   - @playwright/test, with a webServer block in playwright.config.ts, e.g.:
#       webServer: {
#         command: 'npm run start',
#         url: 'http://localhost:3000',
#         reuseExistingServer: !process.env.CI,
#       }
# =============================================================================

name: CI

on:
  push:
    branches: [main, release] # main is the released state, release is what gets tested
  pull_request:

permissions:
  contents: read

# A new push to the same branch/PR cancels running jobs (saves minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24' # matches the node:24-trixie base image of the dev container
  # Starts at 0 and is raised as the suite grows. A threshold a fresh project
  # cannot meet makes the pipeline red from day one, and a pipeline that is
  # always red is a pipeline nobody reads.
  COVERAGE_MIN: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Lint & types - all check-only (prettier --check instead of --write), so the
  # pipeline fails on deviations rather than silently fixing them
  # ---------------------------------------------------------------------------
  lint:
    name: ESLint, Prettier & tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier (check-only)
        run: npx prettier --check .

      - name: Generate route types
        # Next writes LayoutProps, PageProps and friends into .next/types during a
        # build, and tsconfig includes them. Without this, tsc on a fresh checkout
        # fails on generated types that simply are not there yet.
        run: npx next typegen

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Unit and component tests - Vitest with V8 coverage and a configurable
  # minimum. Thresholds can also live in vitest.config.ts (coverage.thresholds),
  # in which case the four flags below can go.
  # ---------------------------------------------------------------------------
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Look for a Vitest setup
        id: probe
        run: |
          if [ -n "$(ls vitest.config.* vitest.workspace.* 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Vitest configuration in this repository yet." >> "$GITHUB_STEP_SUMMARY"
            echo "Add vitest.config.ts and this job starts running for real." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.probe.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.probe.outputs.found == 'true'
        run: npm ci

      - name: Run Vitest (coverage minimum enforced)
        if: steps.probe.outputs.found == 'true'
        run: >-
          npx vitest run --coverage
          --coverage.thresholds.lines=${{ env.COVERAGE_MIN }}
          --coverage.thresholds.functions=${{ env.COVERAGE_MIN }}
          --coverage.thresholds.branches=${{ env.COVERAGE_MIN }}
          --coverage.thresholds.statements=${{ env.COVERAGE_MIN }}

  # ---------------------------------------------------------------------------
  # Build - catches what lint and tests miss (broken imports, server/client
  # component errors), with a cache on .next/cache for speed
  # ---------------------------------------------------------------------------
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx next build

  # ---------------------------------------------------------------------------
  # E2E - Playwright with Chromium only (add firefox/webkit if needed); the
  # HTML report is uploaded as an artifact on failure
  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Look for a Playwright setup
        id: probe
        run: |
          if [ -n "$(ls playwright.config.* 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Playwright configuration in this repository yet." >> "$GITHUB_STEP_SUMMARY"
            echo "Add playwright.config.ts with a webServer block and this job starts running for real." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.probe.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Next.js build cache
        if: steps.probe.outputs.found == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        if: steps.probe.outputs.found == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.probe.outputs.found == 'true'
        run: npx playwright install --with-deps chromium

      - name: Create production build
        if: steps.probe.outputs.found == 'true'
        run: npx next build

      - name: Run Playwright
        if: steps.probe.outputs.found == 'true'
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Security - npm audit reads package-lock.json (no node_modules needed);
  # --audit-level=high only fails on high/critical, set to 'moderate' for a
  # stricter policy
  # ---------------------------------------------------------------------------
  audit:
    name: Security audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        run: npm audit --audit-level=high
