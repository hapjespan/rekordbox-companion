# Install as: .github/dependabot.yml
#
# The CI templates pin action majors, and a pinned major goes stale on its own:
# three of them were a full major behind within weeks of being written. This is
# what keeps them honest without anyone remembering to check.
#
# npm (web/) and uv (engine/) entries added now that those manifests exist
# (T095, phase 6 build: .github/workflows/ci.yml is the first thing that
# actually installs from them).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ['*']
