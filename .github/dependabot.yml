# Install as: .github/dependabot.yml
#
# The CI templates pin action majors, and a pinned major goes stale on its own:
# three of them were a full major behind within weeks of being written. This is
# what keeps them honest without anyone remembering to check.
#
# npm (web/) and uv (engine/) entries added now that those manifests exist
# (T095, phase 6 build: .github/workflows/ci.yml is the first thing that
# actually installs from them).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # Minor and patch updates travel together, because a batch of those is one
  # review and one CI run. Majors are deliberately left out of the group so each
  # arrives as its own pull request: the grouped npm PR of 2026-08-22 carried
  # TypeScript 5 -> 7, ESLint 9 -> 10 and Vite 5 -> 8 at once, and was
  # unmergeable as a unit because typescript-eslint refuses TS 7, ESLint 10 adds
  # 17 errors in existing code, and Vite 8 moved `test` out of its config type.
  # Three separate migrations behind one green-or-red check is a PR nobody can
  # act on.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
