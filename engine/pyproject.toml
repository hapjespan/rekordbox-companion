[project]
name = "companion"
version = "0.1.0"
description = "Rekordbox Companion v1 backend"
authors = [
    { name = "Martien", email = "martienvb@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyrekordbox>=0.4",
    "rapidfuzz>=3.10",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
