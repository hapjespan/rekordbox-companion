services:
  dev:
    build: .
    container_name: "rekordbox-companion-dev"
    volumes:
      - .:/workspace/rekordbox-companion
      # Claude Code writes sessions, history and project state here, so this one
      # cannot be read-only. It carries .credentials.json: see the security note
      # in the claude-config README before adding an untrusted dependency.
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
      - /root/knowledge:/workspace/knowledge
      # The host's gh config, read-only and out of the way. The entrypoint copies
      # the token into a writable container-local config dir, because gh migrates
      # and rewrites its own config on first run and dies on a read-only file.
      # A container can therefore use the token but not rewrite the host's copy.
      - /root/.config/gh:/run/host-gh:ro
      - /root/.gitconfig:/root/.gitconfig:ro
    environment:
      GH_CONFIG_DIR: /root/.gh
      # The ports block publishes DEV_PORT:DEV_PORT, so the server inside the
      # container has to bind DEV_PORT too, not its framework default. Vite
      # reads no port env by itself, so VITE_PORT is exported for vite.config
      # or `pnpm dev -- --port`; uvicorn takes --port ${DEV_PORT} in its script.
      PORT: ${DEV_PORT:-8787}
      VITE_PORT: ${VITE_PORT:-5173}
      # Bind the in-container processes to all interfaces: the loopback-only
      # security posture (below) is enforced by the *host*-side publish
      # binding to 127.0.0.1, not by the process inside the container. A
      # process bound to 127.0.0.1 inside its own network namespace is
      # unreachable through Docker's published port, which arrives on the
      # container's other interface, never its loopback.
      DEV_HOST: 0.0.0.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p "$$GH_CONFIG_DIR" && chmod 700 "$$GH_CONFIG_DIR"
        cp /run/host-gh/hosts.yml "$$GH_CONFIG_DIR/hosts.yml" 2>/dev/null || true
        chmod 600 "$$GH_CONFIG_DIR/hosts.yml" 2>/dev/null || true
        exec sleep infinity
    ports:
      # Bound to the loopback interface on purpose: this host is reachable from
      # the internet, and a dev server is not. Reach it over an SSH tunnel:
      #   ssh -L 3000:127.0.0.1:3000 root@<host>
      - "127.0.0.1:${DEV_PORT:-3000}:${DEV_PORT:-3000}"
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    working_dir: /workspace/rekordbox-companion
    networks: [dev-net]
    tty: true

networks:
  dev-net:
    external: true
